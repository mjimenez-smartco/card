<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mauri Jimenez | SmartCo Packaging</title>
<meta name="description" content="Mauri Jimenez, Technical Product Development en SmartCo Packaging. Guarda el contacto, llama o escribe.">
<meta name="theme-color" content="#EFEFEF">
<meta name="robots" content="noindex">
<meta property="og:title" content="Mauri Jimenez | SmartCo Packaging">
<meta property="og:description" content="Technical Product Development">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Nunito+Sans:opsz,wght@6..12,700;6..12,900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Corporatus";
    src: url("fonts/corporatus.otf") format("opentype");
    font-display: swap;
  }

  :root {
    --orange: #FF6B00;
    --orange-press: #E85F00;
    --ink: #1F2123;
    --gray: #53575A;
    --paper: #FAFCFA;
    --mist: #ECF2ED;
    --board: #EFEFEF;
    --line: rgba(83, 87, 90, 0.16);
    --display: "Corporatus", "Michroma", "Avenir Next", sans-serif;
    --body: "Avenir Black", "Avenir Next", Avenir, "Nunito Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--board) url("assets/fondo-carton.webp") repeat;
    color: var(--gray);
    font-family: var(--body);
    font-weight: 800;
    font-size: 1rem;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: var(--orange); color: var(--ink); }

  a { color: inherit; text-decoration: none; }

  :focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 3px;
  }

  .page {
    width: 100%;
    max-width: 27.5rem;
    margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
    overflow: hidden;
  }

  /* Header pill, same shape as the site nav */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 0.75rem 0.75rem 1.5rem;
    background: var(--paper);
    border-radius: 50px;
    box-shadow: 0 12px 50px rgba(19, 84, 71, 0.08);
  }

  .bar img { display: block; height: 2rem; width: auto; }

  .lang {
    display: inline-flex;
    padding: 0.1875rem;
    background: var(--mist);
    border-radius: 50px;
  }

  .lang button {
    min-width: 2.75rem;
    min-height: 2.25rem;
    padding: 0 0.75rem;
    border: 0;
    border-radius: 50px;
    background: transparent;
    color: var(--gray);
    font: inherit;
    font-size: 0.8125rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* Hero */
  .boxes {
    display: block;
    width: 82%;
    height: auto;
    margin: 1.25rem -1.5rem 0 auto;
  }

  h1 {
    margin: -0.5rem 0 0;
    color: var(--orange);
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.125rem, 10.5vw, 2.875rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }

  h1 span { display: block; }

  .role {
    margin: 0.75rem 0 0;
    color: var(--ink);
    font-size: 1.0625rem;
  }

  .org { margin: 0.125rem 0 0; font-size: 0.9375rem; }

  /* Actions */
  .sheet {
    margin-top: 1.75rem;
    padding: 0.75rem;
    background: var(--paper);
    border-radius: 2rem;
    box-shadow: 0 10px 46px rgba(1, 7, 39, 0.1);
  }

  .save {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.625rem;
    min-height: 3.75rem;
    padding: 0 1.5rem;
    background: var(--orange);
    border-radius: 50px;
    color: var(--ink);
    font-size: 1.0625rem;
    transition: transform 0.5s var(--spring), background 0.2s ease;
  }

  .save:active {
    transform: scale(0.96);
    background: var(--orange-press);
    transition: transform 0.08s ease-out, background 0.08s ease-out;
  }

  .links { list-style: none; margin: 0.25rem 0 0; padding: 0; }

  .links li + li { border-top: 1px solid var(--line); }

  .links a {
    display: grid;
    grid-template-columns: 2.75rem 1fr auto;
    align-items: center;
    gap: 0.875rem;
    min-height: 4.25rem;
    padding: 0.5rem 0.75rem 0.5rem 0.5rem;
    border-radius: 1.25rem;
    transition: background 0.2s ease, transform 0.5s var(--spring);
  }

  .links a:active {
    background: var(--mist);
    transform: scale(0.98);
    transition: background 0.08s ease-out, transform 0.08s ease-out;
  }

  .ico {
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    background: var(--ink);
    border-radius: 50%;
    color: var(--orange);
  }

  .label { display: block; font-size: 0.8125rem; }

  .value {
    display: block;
    color: var(--ink);
    font-size: 1rem;
    overflow-wrap: anywhere;
  }

  .go { color: var(--gray); transition: transform 0.3s var(--out), color 0.2s ease; }

  svg {
    display: block;
    width: 1.25rem;
    height: 1.25rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @media (hover: hover) {
    .save:hover { background: var(--orange-press); }
    .links a:hover { background: var(--mist); }
    .links a:hover .go { transform: translateX(3px); color: var(--orange); }
    .lang button[aria-pressed="false"]:hover { color: var(--ink); }
  }

  address {
    margin: 1.75rem 0.75rem 0;
    font-style: normal;
    font-size: 0.8125rem;
    line-height: 1.5;
  }

  /* Entrance: the boxes get set down, the rest follows in sequence */
  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: rise 0.45s var(--out) backwards; animation-delay: calc(var(--i) * 90ms + 120ms); }
    .boxes { animation: set-down 0.7s var(--spring) backwards; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
    }

    @keyframes set-down {
      from { opacity: 0; transform: translateY(-22px) scale(0.96); }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<main class="page">

  <header class="bar">
    <img src="assets/logo-smartco.webp" width="553" height="140" alt="SmartCo Packaging">
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <img class="boxes" src="assets/boxes.webp" width="698" height="533" alt="">

  <h1 class="rise" style="--i:0"><span>Mauri</span><span>Jimenez</span></h1>
  <p class="role rise" style="--i:1">Technical Product Development</p>
  <p class="org rise" style="--i:1">SmartCo Packaging</p>

  <section class="sheet rise" style="--i:2" aria-label="Contacto">
    <a class="save" href="contact.vcf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2.5 20.5c.6-3.6 3.6-6 7.5-6 1.5 0 2.9.4 4 1"/><path d="M18.5 14v6M15.5 17h6"/></svg>
      <span data-es="Guardar contacto" data-en="Save contact">Guardar contacto</span>
    </a>

    <ul class="links">
      <li>
        <a href="tel:+526643852132">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h2.6l1.4 4-2 1.5a12 12 0 0 0 6.4 6.4l1.5-2 4 1.4v2.6a2.1 2.1 0 0 1-2.3 2.1A16.4 16.4 0 0 1 4.5 5.8a2.1 2.1 0 0 1 2.1-2.3Z"/></svg></span>
          <span><span class="label" data-es="Llamar" data-en="Call">Llamar</span><span class="value">+52 664 385 2132</span></span>
          <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </li>
      <li>
        <a href="https://wa.me/526643852132" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.1A8.3 8.3 0 1 1 8.4 19L4 20Z"/><path d="M9 9.6c0 2.6 2.4 5 5 5"/></svg></span>
          <span><span class="label">WhatsApp</span><span class="value" data-es="Enviar mensaje" data-en="Send a message">Enviar mensaje</span></span>
          <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </li>
      <li>
        <a href="mailto:m.jimenez@smartco.mx">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M4 7.5l8 6 8-6"/></svg></span>
          <span><span class="label" data-es="Correo" data-en="Email">Correo</span><span class="value">m.jimenez@smartco.mx</span></span>
          <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </li>
      <li>
        <a href="https://smartco.mx" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5S9.4 5.9 12 3.5Z"/></svg></span>
          <span><span class="label" data-es="Sitio web" data-en="Website">Sitio web</span><span class="value">smartco.mx</span></span>
          <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </li>
    </ul>
  </section>

  <address class="rise" style="--i:3">
    Segunda 16700, La Cienega Poniente<br>
    22114 Tijuana, B.C.
  </address>

</main>

<script>
  (function () {
    var buttons = document.querySelectorAll('.lang button');

    function setLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-' + lang + ']').forEach(function (el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      document.querySelector('.sheet').setAttribute('aria-label', lang === 'en' ? 'Contact' : 'Contacto');
      buttons.forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
      });
    }

    buttons.forEach(function (b) {
      b.addEventListener('click', function () { setLang(b.dataset.lang); });
    });

    if (/^en\b/i.test(navigator.language || '')) setLang('en');
  })();
</script>
</body>
</html>
