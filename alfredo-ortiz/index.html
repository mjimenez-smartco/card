<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfredo Ortiz | SmartCo Packaging</title>
<meta name="description" content="Alfredo Ortiz, SmartCo Packaging. Guarda el contacto, llama o escribe.">
<meta name="theme-color" content="#EFEFEF">
<meta name="robots" content="noindex">
<meta property="og:title" content="Alfredo Ortiz | SmartCo Packaging">
<meta property="og:description" content="SmartCo Packaging">
<link rel="icon" href="../assets/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Nunito+Sans:opsz,wght@6..12,700;6..12,900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Corporatus";
    src: url("../fonts/corporatus.otf") format("opentype");
    font-display: swap;
  }

  :root {
    --orange: #FF6B00;
    --orange-press: #E85F00;
    --ink: #1F2123;
    --gray: #53575A;
    --paper: #FAFCFA;
    --mist: #ECF2ED;
    --board: #EFEFEF;
    --line: rgba(83, 87, 90, 0.16);
    --display: "Corporatus", "Michroma", "Avenir Next", sans-serif;
    --body: "Avenir Black", "Avenir Next", Avenir, "Nunito Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--board) url("../assets/fondo-carton.webp") repeat;
    color: var(--gray);
    font-family: var(--body);
    font-weight: 800;
    font-size: 1rem;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: var(--orange); color: var(--ink); }

  a { color: inherit; text-decoration: none; }

  :focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 3px;
  }

  .page {
    width: 100%;
    max-width: 27.5rem;
    margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
    overflow: hidden;
  }

  /* Header pill, same shape as the site nav */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 0.75rem 0.75rem 1.5rem;
    background: var(--paper);
    border-radius: 50px;
    box-shadow: 0 12px 50px rgba(19, 84, 71, 0.08);
  }

  .bar img { display: block; height: 2rem; width: auto; }

  .lang {
    display: inline-flex;
    padding: 0.1875rem;
    background: var(--mist);
    border-radius: 50px;
  }

  .lang button {
    min-width: 2.75rem;
    min-height: 2.25rem;
    padding: 0 0.75rem;
    border: 0;
    border-radius: 50px;
    background: transparent;
    color: var(--gray);
    font: inherit;
    font-size: 0.8125rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* Hero */
  .boxes {
    display: block;
    width: 82%;
    height: auto;
    margin: 1.25rem -1.5rem 0 auto;
  }

  h1 {
    margin: -0.5rem 0 0;
    color: var(--orange);
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.125rem, 10.5vw, 2.875rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }

  h1 span { display: block; }

  .role {
    margin: 0.75rem 0 0;
    color: var(--ink);
    font-size: 1.0625rem;
  }

  .org { margin: 0.125rem 0 0; font-size: 0.9375rem; }

  /* Actions */
  .sheet {
    margin-top: 1.75rem;
    padding: 0.75rem;
    background: var(--paper);
    border-radius: 2rem;
    box-shadow: 0 10px 46px rgba(1, 7, 39, 0.1);
  }

  .save {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.625rem;
    min-height: 3.75rem;
    padding: 0 1.5rem;
    background: var(--orange);
    border-radius: 50px;
    color: var(--ink);
    font-size: 1.0625rem;
    transition: transform 0.5s var(--spring), background 0.2s ease;
  }

  .save:active {
    transform: scale(0.96);
    background: var(--orange-press);
    transition: transform 0.08s ease-out, background 0.08s ease-out;
  }

  .links { list-style: none; margin: 0.25rem 0 0; padding: 0; }

  .links li + li { border-top: 1px solid var(--line); }

  .links a {
    display: grid;
    grid-template-columns: 2.75rem 1fr auto;
    align-items: center;
    gap: 0.875rem;
    min-height: 4.25rem;
    padding: 0.5rem 0.75rem 0.5rem 0.5rem;
    border-radius: 1.25rem;
    transition: background 0.2s ease, transform 0.5s var(--spring);
  }

  .links a:active {
    background: var(--mist);
    transform: scale(0.98);
    transition: background 0.08s ease-out, transform 0.08s ease-out;
  }

  .ico {
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    background: var(--ink);
    border-radius: 50%;
    color: var(--orange);
  }

  .label { display: block; font-size: 0.8125rem; }

  .value {
    display: block;
    color: var(--ink);
    font-size: 1rem;
    overflow-wrap: anywhere;
  }

  .go { color: var(--gray); transition: transform 0.3s var(--out), color 0.2s ease; }

  svg {
    display: block;
    width: 1.25rem;
    height: 1.25rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @media (hover: hover) {
    .save:hover { background: var(--orange-press); }
    .links a:hover { background: var(--mist); }
    .links a:hover .go { transform: translateX(3px); color: var(--orange); }
    .lang button[aria-pressed="false"]:hover { color: var(--ink); }
  }

  /* QR for sharing the card from screen to screen */
  .share {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    margin: 1.75rem 0.75rem 0;
  }

  .qr {
    flex: none;
    width: 9.25rem;
    padding: 1rem;
    background: #fff;
    border-radius: 1.25rem;
    box-shadow: 0 10px 46px rgba(1, 7, 39, 0.1);
  }

  .qr svg {
    width: 100%;
    height: auto;
    fill: var(--ink);
    stroke: none;
  }

  .share h2 {
    margin: 0;
    color: var(--ink);
    font: inherit;
    font-size: 1.0625rem;
    line-height: 1.25;
  }

  .share p { margin: 0.375rem 0 0; font-size: 0.875rem; }

  address {
    margin: 1.75rem 0.75rem 0;
    font-style: normal;
    font-size: 0.8125rem;
    line-height: 1.5;
  }

  /* Entrance: the boxes get set down, the rest follows in sequence */
  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: rise 0.45s var(--out) backwards; animation-delay: calc(var(--i) * 90ms + 120ms); }
    .boxes { animation: set-down 0.7s var(--spring) backwards; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
    }

    @keyframes set-down {
      from { opacity: 0; transform: translateY(-22px) scale(0.96); }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>

<script>
  (function () {
    var buttons = document.querySelectorAll('.lang button');

    function setLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-' + lang + ']').forEach(function (el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      document.querySelector('.sheet').setAttribute('aria-label', lang === 'en' ? 'Contact' : 'Contacto');
      buttons.forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
      });
    }

    buttons.forEach(function (b) {
      b.addEventListener('click', function () { setLang(b.dataset.lang); });
    });

    if (/^en\b/i.test(navigator.language || '')) setLang('en');
  })();
</script>
